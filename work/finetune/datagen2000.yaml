# NEW fine-tuning data for case2000_goc: same perturbation family as work/goc2000/datagen.yaml, seed 1234 (test: 0),
# 1500 load scenarios of which only indices 1000-1499 are generated (test: 0-999), see 00_datagen_skip.py.
#   work/texas/tmo 20000 .venv/bin/python work/finetune/00_datagen_skip.py work/finetune/datagen2000.yaml 1000
network:
  name: case2000_goc
  source: file
  network_dir: work/goc2000/net
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 1500
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: 5
  n_topology_variants: 5
  elements: [branch]
generation_perturbation:
  type: cost_permutation
  sigma: 1.0
admittance_perturbation:
  type: random_perturbation
  sigma: 0.2
settings:
  num_processes: 4
  data_dir: work/finetune/data2000_all
  large_chunk_size: 500
  overwrite: true
  mode: pf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 1234
