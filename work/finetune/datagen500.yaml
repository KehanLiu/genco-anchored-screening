# NEW fine-tuning data for case500_goc: same perturbation family as the test set (work/goc500/datagen.yaml:
# random removal of up to 5 branches) but seed 1234 (test: 0) and 6000 load scenarios (test: indices 0-2999).
# Only load_scenario_idx >= 3000 is used (hours of the aggregate profile the test set never touches):
#   3000-4999 -> training/validation, 5000-5999 -> active-learning pool; 0-2999 are generated but unused.
#   work/texas/tmo 14400 .venv/bin/gridfm_datakit generate work/finetune/datagen500.yaml
#   .venv/bin/gridfm_datakit generate work/goc500/datagen.yaml
network:
  name: case500_goc
  source: file
  network_dir: work/goc500/net
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 6000
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: 5
  n_topology_variants: 5
  elements: [branch]
generation_perturbation:
  type: cost_permutation
  sigma: 1.0
admittance_perturbation:
  type: random_perturbation
  sigma: 0.2
settings:
  num_processes: 4
  data_dir: work/finetune/data500_all
  large_chunk_size: 500
  overwrite: true
  mode: pf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 1234
