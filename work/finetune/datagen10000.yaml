# NEW fine-tuning data for case10000_goc: same perturbation family as work/goc10000/datagen.yaml, seed 1234 (test: 0),
# 500 load scenarios of which only indices 200-499 are generated (test: 0-199), see 00_datagen_skip.py
# (large_chunk_size 25 divides both 200 and 500; the test run used 30 -> same memory footprint, ~15 GB with 3 processes).
#   work/finetune/00_datagen10000.sh
network:
  name: case10000_goc
  source: file
  network_dir: work/goc10000/net
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 500
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: 5
  n_topology_variants: 5
  elements: [branch]
generation_perturbation:
  type: cost_permutation
  sigma: 1.0
admittance_perturbation:
  type: random_perturbation
  sigma: 0.2
settings:
  num_processes: 3
  data_dir: work/finetune/data10000_all
  large_chunk_size: 25
  overwrite: true
  mode: pf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 1234
