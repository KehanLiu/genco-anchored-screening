# GOC 500 near-replication of the organisers' example: random topology perturbation, up to k=5 branches removed.
# Load / generation / admittance settings mirror germany/datagen_pilot.yaml (= args.log of the published
# gridfm/pf_small_case118_ieee dataset); the case500_goc checkpoint yaml does not record datakit settings.
#   .venv/bin/gridfm_datakit generate work/goc500/datagen_pilot.yaml
network:
  name: case500_goc
  source: file
  network_dir: work/goc500/net
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 12
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: 5
  n_topology_variants: 5
  elements: [branch]
generation_perturbation:
  type: cost_permutation
  sigma: 1.0
admittance_perturbation:
  type: random_perturbation
  sigma: 0.2
settings:
  num_processes: 6
  data_dir: work/goc500/data_pilot
  large_chunk_size: 500
  overwrite: true
  mode: pf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 0
