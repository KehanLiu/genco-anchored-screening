# FRESH confirmation pool for case2000_goc (seed 2026, hours 1500-1999 only; test pool seed 0 hours 0-499, fine-tune pool seed 1234 hours 1000-1499). work/fresh/README.md 2.1
#   work/fresh/datagen_chain.sh (generation via work/finetune/00_datagen_skip.py with SKIP = first fresh hour)
network:
  name: case2000_goc
  source: file
  network_dir: work/goc2000/net
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 2000
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: 5
  n_topology_variants: 5
  elements: [branch]
generation_perturbation:
  type: cost_permutation
  sigma: 1.0
admittance_perturbation:
  type: random_perturbation
  sigma: 0.2
settings:
  num_processes: 4
  data_dir: work/fresh/data2000
  large_chunk_size: 500
  overwrite: true
  mode: pf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 2026
